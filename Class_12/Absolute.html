<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-..."
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      
      .box {
        width: 300px;
        height: 400px;
        margin: 40px 0px 0px 30px;
        position: relative;
        
      }
      img {
        width: 100%;
        height: 100%;
        border-radius: 10px;
        
      }
      .fa-heart {
        position: absolute;
        color:red;
        top: 20px;
        right: 20px;
        font-size: 35px;
        
        
      }
      .fa-cart-shopping{
        position: absolute;
        left: 20px;
        top: 20px;
        font-size: 35px;
        color: chocolate;
      }
      h3{
        position: absolute;
        bottom: 40px;
        left: 20%;
        font-size: 45px;
        color: chocolate;
      }
      button{
        position: absolute;
         bottom: 10px;
        left: 35%;
        width: 80px;
        height: 30px;
        background-color: blue;
        color: white;
        border-radius: 10px;

      }
    </style>
  </head>
  <body>
    <div class="box">
      <i class="fa-solid fa-heart"></i>
      <i class="fa-solid fa-cart-shopping"></i>
      <img src="../image/1756564980191 - Copy (2).jpg" alt="" />
      <h3>Face Wash</h3>
      <button>Order</button>
    </div>
  </body>
</html>
