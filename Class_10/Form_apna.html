<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        background-color: rgb(55, 53, 53);
    }
    form{
        background-color: rgb(0, 0, 0);
        display: block;
        width: 400px;
        height: 400px;
        border: 10px solid  rgb(0, 140, 255);
        border-radius: 50%;
        margin: auto;
        margin-top: 100px;
        padding:65px 20px;
        text-align: center;
    }
    h1{
        margin-bottom: 20px;
        color:  rgb(0, 140, 255);
        font-family:Verdana, Geneva, Tahoma, sans-serif ;
        
    }
    label{
        color: rgb(0, 140, 255);
        font-family: Verdana, 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }
    input{
        display: block;
        margin-left: 26%;
        margin-bottom: 12px;
        background-color: rgb(0, 140, 255);
        padding: 7px;
        border-radius: 20px;
        color: white;
        border: 1px solid black;
    }
    input[type="submit"]{
        border-radius: 9px;
        margin: auto;
        width: 72px;
        font-family: Verdana, ; 
    }
    
    input:focus{
        outline: none;
    }
    </style>
</head>
<body>
    <form action="">
        <h1>Login</h1>
        <label for="">User Name</label>
        <input type="text">
        <label for="">Password</label>
        <input type="password">
        <input type="submit" value="Go">
    </form>
</body>
</html>
