<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legend Form</title>
    <style>
      * {
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
      }
      
      form {
        margin: auto;
        min-width: 50%;
        max-width: 30%;
      }
      fieldset {
        /* height: 350px; */
        margin-top: 130px;
        padding: 20px 25px;
        border: 1px solid burlywood;
        border-radius: 10px;
        box-shadow: 1px 1px 20px rgb(11, 11, 11);
      }
      legend {
        font-size: 20px;
        border: 1px solid burlywood;
        border-radius: 10px;
        padding: 10px;
        background-color: white;
      }
      label {
        font-size: 20px;
      }
      input[type="text"],
      input[type="password"],
      input[type="submit"],
      select {
        display: block;
        width: 100%;
        margin-bottom: 15px;
        padding: 10px;
        border: 1px solid burlywood;
        border-radius: 10px;
      }
      select {
        font-size: 19px;
        margin-top: 29px;
      }
      input[type="submit"] {
        background-color: rgb(0, 11, 128);
        color: white;
        margin-top: 25px;
        cursor: pointer;
        padding: 13px;
      }
      /* select:hover{
             background-color: rgb(28, 215, 28);
            color: white;
        } */
      option {
        background-color: white;
        color: black;
      }
      input[type="submit"]:hover {
        background-color: rgb(2, 5, 41);
        color: white;
      }
    </style>
  </head>
  <body>
    <form action="">
      <fieldset>
        <legend>Student Form</legend>
        <label for="">Name</label>
        <input type="text" />
        <label for="">Password</label>
        <input type="password" />
        <select name="" id="">
          <option value="">Select Course</option>
          <option value="HTML">HTML</option>
          <option value="CSS">CSS</option>
          <option value="JavaScript">JavaScript</option>
          <option value="React">React</option>
          <option value="Node JS">Node JS</option>
          <input type="submit" value="Submit" />
        </select>
      </fieldset>
    </form>
  </body>
</html>
