<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            margin: 10px;
            display: inline-block;
        }

        .box1 {
            background-color: red;
        }

        .box2 {
            background-color: rgb(0, 255, 0);
        }

        .box3 {
            background-color: #ff82ff;
        }

        .box4 {
            background-color: rgba(0, 0, 255, 0.1);
        }

        .box5 {
            background-color: purple;
            opacity: 0.2;
        }
    </style>
</head>

<body>
    <div class="box box1">
        <h1>Red</h1>
    </div>
    <div class="box box2">
        <h1>Green</h1>
    </div>
    <div class="box box3">
        <h1>Pink</h1>
    </div>
    <div class="box box4">
        <h1>Blue</h1>
    </div>
    <div class="box box5">
        <h1>Purple</h1>
    </div>
</body>

</html>
