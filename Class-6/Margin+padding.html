<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin, Padding, and Border</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
      }
      .common {
        width: 300px;
        margin: 20px;
        padding: 20px;
        border: 10px inset gold;
        background-color: #c3cdd8;
      }
      .individual {
        width: 300px;
        margin-top: 10px;
        margin-right: 30px;
        margin-bottom: 20px;
        margin-left: 40px;
        padding-top: 10px;
        padding-right: 20px;
        padding-bottom: 30px;
        padding-left: 40px;
        border-top: 2px solid tomato;
        border-right: 4px dashed seagreen;
        border-bottom: 6px double darkorange;
        border-left: 8px dotted slateblue;
        background-color: #f4fbe9;
      }
    </style>
  </head>
  <body>
    <div class="common">
      <p>Margin, padding, and border use one value for every side.</p>
    </div>

    <div class="individual">
      <p>Each side has its own margin, padding, and border value.</p>
    </div>
  </body>
</html>
